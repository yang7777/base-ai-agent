<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BASE AI CHAT</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-top: 20px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #response {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }

    #walletAddress {
      margin-top: 10px;
      color: blue;
      word-break: break-all;
    }
  </style>
</head>

<body>

<h1>BASE AI CHAT</h1>

<button onclick="connectWallet()">
  Connect Wallet
</button>

<p id="walletAddress"></p>

<textarea id="userInput" placeholder="Type your message..."></textarea>

<br />

<button onclick="sendMessage()">Send</button>

<div id="response"></div>

<script>

const USDC_ADDRESS = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";

const ERC20_ABI = [
  "function transfer(address to, uint amount) returns (bool)",
  "function balanceOf(address owner) view returns (uint256)",
  "function decimals() view returns (uint8)"
];

let currentAccount = null;
let provider = null;

async function connectWallet() {
  try {

    console.log("connectWallet start");

    provider = window.ethereum;

    if (!provider) {
      alert("Wallet not found");
      return;
    }

    const accounts = await provider.request({
      method: "eth_requestAccounts",
    });

    currentAccount = accounts[0];

    console.log("account:", currentAccount);

    // 🔥 chain switch（失敗しても止めない）
    try {
      await provider.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x2105" }],
      });
    } catch (e) {
      console.log("chain switch ignored:", e.message || e);
    }

    let walletName = "Unknown Wallet";

    if (provider.isCoinbaseWallet) walletName = "Coinbase Wallet";
    else if (provider.isRabby) walletName = "Rabby Wallet";
    else if (provider.isMetaMask) walletName = "MetaMask";

    // ETH残高
    const balance = await provider.request({
      method: "eth_getBalance",
      params: [currentAccount, "latest"],
    });

    const ethBalance = (parseInt(balance, 16) / 1e18).toFixed(4);

    // USDC
    const ethersProvider = new ethers.providers.Web3Provider(provider);
    const contract = new ethers.Contract(
      USDC_ADDRESS,
      ERC20_ABI,
      ethersProvider
    );

    let usdcBalance = "0.00";

    try {
      const raw = await contract.balanceOf(currentAccount);
      const decimals = await contract.decimals();
      usdcBalance = (raw / 10 ** decimals).toFixed(2);
    } catch (e) {
      console.log("USDC error:", e);
    }

    document.getElementById("walletAddress").innerHTML = `
  Wallet Connected
  <br><br>

  Address:<br>
  ${currentAccount}
  <br><br>

  ETH Balance:<br>
  ${ethBalance} ETH
  <br><br>

  USDC Balance:<br>
<span id="usdcBalance">
  ${usdcBalance}
</span> USDC
  
    <hr />

  <h3>USDC Send</h3>

  <input id="toAddress" placeholder="送信先アドレス" style="width:100%;" />
  <br /><br />

  <input id="amount" placeholder="USDC数量" style="width:100%;" />
  <br /><br />

  <button id="sendBtn" onclick="sendUSDC()">
    Send USDC
  </button>

  <p id="sendStatus"></p>
`;
 
  } catch (err) {
    console.error("connectWallet error:", err);
    alert("Wallet connection failed: " + (err.message || err));
  }
}

async function refreshUSDCBalance() {

  try {

    const ethersProvider =
      new ethers.providers.Web3Provider(window.ethereum);

    const contract = new ethers.Contract(
      USDC_ADDRESS,
      ERC20_ABI,
      ethersProvider
    );

    const raw =
      await contract.balanceOf(currentAccount);

    const decimals =
      await contract.decimals();

    const balance =
      Number(
        ethers.utils.formatUnits(
          raw,
          decimals
        )
      ).toFixed(2);

    const balanceElement =
      document.getElementById("usdcBalance");

    if (balanceElement) {
      balanceElement.innerText = balance;
    }

  } catch (err) {

    console.error(
      "refreshUSDCBalance error:",
      err
    );

  }
}

async function sendMessage() {
  const userInput = document.getElementById("userInput").value;

  document.getElementById("response").innerText = "AI thinking...";

  const response = await fetch("http://localhost:3001/chat", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ message: userInput }),
  });

  const data = await response.json();

  document.getElementById("response").innerText = data.reply;
}

async function sendUSDC() {
  try {

    const to = document.getElementById("toAddress").value.trim();
    const amount = document.getElementById("amount").value.trim();

    const status = document.getElementById("sendStatus");
    const sendBtn = document.getElementById("sendBtn");

    // アドレス形式チェック
    if (!ethers.utils.isAddress(to)) {
      status.innerText = "有効なアドレスを入力してください";
      return;
    }

    // 数量チェック
    if (!amount || Number(amount) <= 0) {
      status.innerText = "正しい数量を入力してください";
      return;
    }

    const ethersProvider =
      new ethers.providers.Web3Provider(window.ethereum);

    const signer = ethersProvider.getSigner();

    const contract = new ethers.Contract(
      USDC_ADDRESS,
      ERC20_ABI,
      signer
    );

    // 残高取得
    const rawBalance = await contract.balanceOf(currentAccount);
    const decimals = await contract.decimals();

    const usdcBalance =
      Number(
        ethers.utils.formatUnits(
          rawBalance,
          decimals
        )
      );

    // 残高チェック
    if (Number(amount) > usdcBalance) {
      status.innerText = "残高不足です";
      return;
    }

    // 確認ダイアログ
    const confirmed = confirm(
      `${amount} USDC を送金します。\n\n送信先:\n${to}`
    );

    if (!confirmed) {
      status.innerText = "キャンセルしました";
      return;
    }

    const value = ethers.utils.parseUnits(amount, 6);

    sendBtn.disabled = true;
    sendBtn.innerText = "Sending...";

    status.innerText = "ウォレット承認待ち...";

    const tx = await contract.transfer(
      to,
      value
    );

    status.innerHTML = `
      トランザクション送信済み
      <br><br>

      <a href="https://basescan.org/tx/${tx.hash}"
         target="_blank">
         Basescanで確認
      </a>
    `;

    await tx.wait();

    await refreshUSDCBalance();

    status.innerHTML = `
      ✅ 送金成功
      <br><br>

      TX Hash
      <br>
      ${tx.hash}
      <br><br>

      <a href="https://basescan.org/tx/${tx.hash}"
         target="_blank">
         Basescanで確認
      </a>
    `;

  } catch (err) {

    console.error(err);

    document.getElementById("sendStatus").innerText =
      "エラー: " +
      (err.reason ||
       err.message ||
       "Unknown Error");

  } finally {

    const sendBtn =
      document.getElementById("sendBtn");

    if (sendBtn) {
      sendBtn.disabled = false;
      sendBtn.innerText = "Send USDC";
    }
  }
}
  

</script>

</body>
</html>
