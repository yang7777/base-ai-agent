<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BASE AI CHAT</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.min.js"></script>

  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-top: 20px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #response {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }

    #walletAddress {
      margin-top: 10px;
      color: blue;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>BASE AI CHAT</h1>

  <button onclick="connectWallet()">
    Connect Coinbase Wallet
  </button>

  <p id="walletAddress"></p>

  <textarea id="userInput" placeholder="Type your message..."></textarea>

  <br />

  <button onclick="sendMessage()">Send</button>

  <div id="response"></div>

  <script>

    async function connectWallet() {

      if (!window.ethereum) {
        alert("Coinbase Wallet not found");
        return;
      }

      try {

        // ① ウォレット接続
        const accounts =
          await window.ethereum.request({
            method: "eth_requestAccounts",
          });

        // ② Baseへ切替
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0x2105" }],
        });

        // ③ ETH残高取得
        const balance =
          await window.ethereum.request({
            method: "eth_getBalance",
            params: [accounts[0], "latest"],
          });

        // ④ ETH変換
        const ethBalance =
          (parseInt(balance, 16) / 1e18).toFixed(4);

        // ⑤ USDC取得準備
        const provider =
          new ethers.providers.Web3Provider(window.ethereum);

        const usdcAddress =
          "0x833589fCD6EDB6E08f4c7C32D4f71b54bdA02913";

        const abi = [
          "function balanceOf(address owner) view returns (uint256)",
          "function decimals() view returns (uint8)"
        ];

        const usdcContract =
          new ethers.Contract(usdcAddress, abi, provider);

        // ⑥ USDC残高取得
        const rawUsdcBalance =
          await usdcContract.balanceOf(accounts[0]);

        const decimals =
          await usdcContract.decimals();

        const usdcBalance =
          (rawUsdcBalance / 10 ** decimals).toFixed(2);

        // ⑦ 表示
        document.getElementById("walletAddress").innerHTML =
          `
          Connected:<br>
          ${accounts[0]}
          <br><br>

          Base ETH Balance:<br>
          ${ethBalance} ETH

          <br><br>

          USDC Balance:<br>
          ${usdcBalance} USDC
          `;

      } catch (error) {
        console.error(error);
      }

    }

    async function sendMessage() {

      const userInput =
        document.getElementById("userInput").value;

      document.getElementById("response").innerText =
        "AI thinking...";

      const response =
        await fetch("http://localhost:3001/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: userInput,
          }),
        });

      const data = await response.json();

      document.getElementById("response").innerText =
        data.reply;

    }

  </script>

</body>
</html>
