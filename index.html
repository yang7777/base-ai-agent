```html
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BASE AI CHAT</title>

  <style>
    body {
      font-family: Arial;
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 100px;
      margin-top: 20px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      cursor: pointer;
    }

    #response {
      margin-top: 20px;
      padding: 10px;
      border: 1px solid #ccc;
    }

    #walletAddress {
      margin-top: 10px;
      color: blue;
      word-break: break-all;
    }
  </style>
</head>

<body>

  <h1>BASE AI CHAT</h1>

  <button onclick="connectWallet()">
    Connect Coinbase Wallet
  </button>

  <p id="walletAddress"></p>

  <textarea
    id="userInput"
    placeholder="Type your message..."
  ></textarea>

  <br />

  <button onclick="sendMessage()">
    Send
  </button>

  <div id="response"></div>

  <script>

    async function connectWallet() {

      if (window.ethereum) {

        try {

          // ウォレット接続
          const accounts =
            await window.ethereum.request({
              method: "eth_requestAccounts",
            });

          // Base Mainnetへ切替
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: "0x2105" }],
          });

          // Base ETH残高取得
          const balance =
            await window.ethereum.request({
              method: "eth_getBalance",
              params: [accounts[0], "latest"],
            });

          // 16進数 → ETH変換
          const ethBalance =
            (parseInt(balance, 16) / 1e18).toFixed(4);

          // 表示
          document.getElementById("walletAddress").innerHTML =
            `
            Connected:<br>
            ${accounts[0]}
            <br><br>

            Base ETH Balance:<br>
            ${ethBalance} ETH
            `;

        } catch (error) {

          console.error(error);

        }

      } else {

        alert("Coinbase Wallet not found");

      }

    }

    async function sendMessage() {

      const userInput =
        document.getElementById("userInput").value;

      document.getElementById("response").innerText =
        "AI thinking...";

      const response =
        await fetch("http://localhost:3001/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
          },
          body: JSON.stringify({
            message: userInput,
          }),
        });

      const data = await response.json();

      document.getElementById("response").innerText =
        data.reply;

    }

  </script>

</body>
</html>
```
