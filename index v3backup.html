<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BASE AI CHAT Complete</title>
<script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+JP:wght@400;500&display=swap');

:root {
  --bg: #0d0d0d;
  --surface: #141414;
  --surface2: #1a1a1a;
  --border: #2a2a2a;
  --accent: #00e5a0;
  --accent-dim: rgba(0,229,160,0.12);
  --accent-hover: #00ffb3;
  --danger: #ff4d4d;
  --danger-dim: rgba(255,77,77,0.12);
  --warn: #ffb340;
  --warn-dim: rgba(255,179,64,0.12);
  --text: #e8e8e8;
  --text-sub: #888;
  --radius: 8px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'IBM Plex Mono', monospace;
  background: var(--bg);
  color: var(--text);
  max-width: 760px;
  margin: 0 auto;
  padding: 32px 20px 60px;
  min-height: 100vh;
}

h1 {
  font-size: 22px;
  font-weight: 600;
  letter-spacing: 0.08em;
  color: var(--accent);
  margin-bottom: 28px;
  display: flex;
  align-items: center;
  gap: 10px;
}
h1::before {
  content: '';
  display: inline-block;
  width: 8px; height: 8px;
  background: var(--accent);
  border-radius: 50%;
  box-shadow: 0 0 10px var(--accent);
}

h3 {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--text-sub);
  margin-bottom: 14px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 20px;
  margin-top: 14px;
}

input, textarea {
  width: 100%;
  padding: 10px 14px;
  margin-top: 8px;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  outline: none;
  transition: border-color 0.2s;
}
input:focus, textarea:focus {
  border-color: var(--accent);
}
input::placeholder, textarea::placeholder {
  color: #555;
}

button {
  width: 100%;
  padding: 11px 16px;
  margin-top: 10px;
  background: transparent;
  border: 1px solid var(--accent);
  border-radius: var(--radius);
  color: var(--accent);
  font-family: 'IBM Plex Mono', monospace;
  font-size: 13px;
  font-weight: 500;
  letter-spacing: 0.05em;
  cursor: pointer;
  transition: background 0.18s, color 0.18s;
}
button:hover:not(:disabled) {
  background: var(--accent-dim);
  color: var(--accent-hover);
}
button:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
button.primary {
  background: var(--accent);
  color: #000;
  font-weight: 600;
  border-color: var(--accent);
}
button.primary:hover:not(:disabled) {
  background: var(--accent-hover);
  border-color: var(--accent-hover);
  color: #000;
}
button.danger {
  border-color: var(--danger);
  color: var(--danger);
}
button.danger:hover:not(:disabled) {
  background: var(--danger-dim);
}

#connectBtn {
  width: auto;
  padding: 10px 24px;
}

/* ── Status Bar ── */
#statusBar {
  display: none;
  padding: 10px 14px;
  margin-top: 12px;
  border-radius: var(--radius);
  font-size: 12px;
  word-break: break-all;
  font-family: 'IBM Plex Mono', monospace;
}
#statusBar.info  { background: rgba(0,149,255,0.1); border: 1px solid rgba(0,149,255,0.35); color: #6eb4ff; }
#statusBar.error { background: var(--danger-dim); border: 1px solid rgba(255,77,77,0.35); color: var(--danger); }
#statusBar.warn  { background: var(--warn-dim); border: 1px solid rgba(255,179,64,0.35); color: var(--warn); }
#statusBar.ok    { background: rgba(0,229,160,0.08); border: 1px solid rgba(0,229,160,0.35); color: var(--accent); }

/* ── Wallet Info ── */
#walletInfo {
  font-size: 12px;
  color: var(--text-sub);
  line-height: 1.8;
}
#walletInfo .addr {
  color: var(--text);
  font-size: 13px;
  word-break: break-all;
}
#walletInfo .bal {
  color: var(--accent);
  font-size: 14px;
  font-weight: 600;
}

/* ── History / Address Book ── */
.small { font-size: 11px; word-break: break-all; color: var(--text-sub); }
.small + hr { border: none; border-top: 1px solid var(--border); margin: 8px 0; }

/* ── Address Book entry ── */
.ab-entry {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: 8px;
  font-size: 12px;
}
.ab-entry button {
  width: auto;
  padding: 4px 10px;
  margin-top: 0;
  font-size: 11px;
}

/* ================================================================
   CONFIRMATION MODAL
================================================================ */
#modalOverlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.72);
  backdrop-filter: blur(4px);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
#modalOverlay.active {
  display: flex;
}

#modalBox {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  width: 100%;
  max-width: 420px;
  padding: 28px;
  position: relative;
  box-shadow: 0 24px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(0,229,160,0.08);
  animation: modalIn 0.22s cubic-bezier(0.22,1,0.36,1);
}
@keyframes modalIn {
  from { opacity: 0; transform: translateY(16px) scale(0.97); }
  to   { opacity: 1; transform: translateY(0) scale(1); }
}

#modalBox .modal-header {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 22px;
}
#modalBox .modal-header .icon {
  width: 36px; height: 36px;
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 16px;
  flex-shrink: 0;
}
#modalBox .modal-header .icon.eth  { background: rgba(98,126,234,0.18); }
#modalBox .modal-header .icon.usdc { background: rgba(39,117,202,0.18); }

#modalBox .modal-header .title {
  font-size: 15px;
  font-weight: 600;
  letter-spacing: 0.04em;
}
#modalBox .modal-header .subtitle {
  font-size: 11px;
  color: var(--text-sub);
  margin-top: 2px;
}

.modal-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 14px;
  padding: 12px 14px;
  background: var(--surface2);
  border-radius: var(--radius);
  border: 1px solid var(--border);
}
.modal-row .label {
  font-size: 10px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-sub);
}
.modal-row .value {
  font-size: 13px;
  color: var(--text);
  word-break: break-all;
  line-height: 1.5;
}
.modal-row .value.amount {
  font-size: 22px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 0.02em;
}
.modal-row .value.token-tag {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: var(--text-sub);
  margin-top: 2px;
}

.modal-warning {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  padding: 10px 12px;
  background: var(--warn-dim);
  border: 1px solid rgba(255,179,64,0.3);
  border-radius: var(--radius);
  margin-bottom: 18px;
  font-size: 11px;
  color: var(--warn);
  line-height: 1.5;
}
.modal-warning .wi { flex-shrink: 0; margin-top: 1px; }

.modal-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 4px;
}
.modal-actions button {
  margin-top: 0;
}

/* ── Response ── */
#response {
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.7;
  color: var(--text-sub);
  white-space: pre-wrap;
}

/* ================================================================
   TOAST NOTIFICATION
================================================================ */
#toastContainer {
  position: fixed;
  bottom: 28px;
  right: 24px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 10px;
  pointer-events: none;
}

.toast {
  pointer-events: auto;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 14px 18px;
  min-width: 280px;
  max-width: 380px;
  box-shadow: 0 16px 40px rgba(0,0,0,0.5);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  animation: toastIn 0.28s cubic-bezier(0.22,1,0.36,1);
  transition: opacity 0.3s, transform 0.3s;
}
.toast.hiding {
  opacity: 0;
  transform: translateX(20px);
}
@keyframes toastIn {
  from { opacity: 0; transform: translateX(20px); }
  to   { opacity: 1; transform: translateX(0); }
}
.toast.ok    { border-left: 3px solid var(--accent); }
.toast.error { border-left: 3px solid var(--danger); }

.toast-icon {
  font-size: 18px;
  flex-shrink: 0;
  margin-top: 1px;
}
.toast-body {
  flex: 1;
  min-width: 0;
}
.toast-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--text);
  margin-bottom: 3px;
}
.toast-msg {
  font-size: 11px;
  color: var(--text-sub);
  word-break: break-all;
  line-height: 1.5;
}
.toast-link {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  margin-top: 6px;
  font-size: 11px;
  color: var(--accent);
  text-decoration: none;
  border-bottom: 1px solid rgba(0,229,160,0.3);
  padding-bottom: 1px;
  transition: color 0.15s;
}
.toast-link:hover { color: var(--accent-hover); }
.toast-close {
  width: auto !important;
  padding: 2px 6px !important;
  margin: 0 !important;
  font-size: 14px !important;
  border: none !important;
  color: var(--text-sub) !important;
  background: transparent !important;
  flex-shrink: 0;
  line-height: 1;
  cursor: pointer;
}
.toast-close:hover { color: var(--text) !important; }
</style>
</head>
<body>

<h1>BASE AI CHAT</h1>
<button id="connectBtn" onclick="connectWallet()">Connect Wallet</button>

<div id="statusBar"></div>

<div class="card">
  <div id="walletInfo">Not Connected</div>
</div>

<div class="card">
  <h3>ETH Send</h3>
  <input id="ethTo" placeholder="Recipient address (0x...)">
  <input id="ethAmount" placeholder="Amount (ETH)">
  <button id="btnSendETH" onclick="initiateSend('ETH')">Send ETH</button>
</div>

<div class="card">
  <h3>USDC Send</h3>
  <input id="usdcTo" placeholder="Recipient address (0x...)">
  <input id="usdcAmount" placeholder="Amount (USDC)">
  <button id="btnSendUSDC" onclick="initiateSend('USDC')">Send USDC</button>
</div>

<div class="card">
  <h3>Saved Addresses</h3>
  <input id="saveName" placeholder="Label">
  <input id="saveAddress" placeholder="Address (0x...)">
  <button onclick="saveAddress()">Save Address</button>
  <div id="addressBook"></div>
</div>

<div class="card">
  <h3>Transaction History</h3>
  <div id="history"></div>
</div>

<div class="card">
  <h3>AI Chat</h3>
  <textarea id="userInput" rows="3" placeholder="Type your message..."></textarea>
  <button onclick="sendMessage()">Send</button>
  <div id="response"></div>
</div>

<!-- Toast Notifications -->
<div id="toastContainer"></div>

<!-- ================================================================
     CONFIRMATION MODAL
================================================================ -->
<div id="modalOverlay" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div id="modalBox">

    <div class="modal-header">
      <div class="icon" id="modalIcon"></div>
      <div>
        <div class="title" id="modalTitle">送金確認</div>
        <div class="subtitle">内容をよく確認してから承認してください</div>
      </div>
    </div>

    <!-- 送金額 -->
    <div class="modal-row">
      <div class="label">送金額</div>
      <div class="value amount" id="modalAmount">—</div>
      <div class="value token-tag" id="modalToken">—</div>
    </div>

    <!-- 送金先 -->
    <div class="modal-row">
      <div class="label">送金先アドレス</div>
      <div class="value" id="modalTo">—</div>
    </div>

    <!-- ネットワーク -->
    <div class="modal-row">
      <div class="label">ネットワーク</div>
      <div class="value" style="color:var(--accent)">Base Mainnet</div>
    </div>

    <!-- 警告 -->
    <div class="modal-warning">
      <span class="wi">⚠</span>
      <span>送金後のキャンセルはできません。アドレスと金額を再度ご確認ください。</span>
    </div>

    <div class="modal-actions">
      <button class="danger" onclick="cancelModal()">Cancel</button>
      <button class="primary" id="modalConfirmBtn" onclick="confirmSend()">Confirm &amp; Sign</button>
    </div>

  </div>
</div>

<script>
/* ================================================================
   定数
================================================================ */
const USDC_ADDRESS  = "0x833589fCD6eDb6E08f4c7C32D4f71b54bdA02913";
const BASE_CHAIN_ID = "0x2105";

const ERC20_ABI = [
  "function transfer(address to,uint amount) returns (bool)",
  "function balanceOf(address owner) view returns (uint256)",
  "function decimals() view returns (uint8)"
];

/* ================================================================
   状態管理
================================================================ */
let currentAccount = null;

// モーダル用: 確認後に実行するコールバックを保持
let _pendingTx = null; // { token: 'ETH'|'USDC', to: string, amount: string }

/* ================================================================
   UI ヘルパー
================================================================ */
function showStatus(msg, type = "info") {
  const bar = document.getElementById("statusBar");
  bar.textContent = msg;
  bar.className   = type;
  bar.style.display = "block";
}
function hideStatus() {
  document.getElementById("statusBar").style.display = "none";
}
function setBusy(btnId, busy, label) {
  const btn = document.getElementById(btnId);
  btn.disabled    = busy;
  btn.textContent = label;
}

/* ================================================================
   エラーコード → 日本語メッセージ変換
================================================================ */
function friendlyError(e) {
  if (e.code === 4001 || e.code === "ACTION_REJECTED") {
    return "キャンセルされました（ウォレットで拒否されました）";
  }
  if (e.code === -32603 || (e.message && e.message.includes("insufficient funds"))) {
    return "残高またはガスが不足しています";
  }
  if (e.code === "NETWORK_ERROR") {
    return "ネットワークエラーが発生しました。接続を確認してください";
  }
  if (e.code === "UNPREDICTABLE_GAS_LIMIT") {
    return "ガスの見積もりに失敗しました。送金先アドレスを確認してください";
  }
  return "エラー: " + (e.reason || e.message || String(e));
}

/* ================================================================
   ガード
================================================================ */
function requireWallet() {
  if (typeof window.ethereum === "undefined") {
    throw new Error("ウォレットが見つかりません。MetaMask などをインストールしてください");
  }
  if (!currentAccount) {
    throw new Error("先にウォレットを接続してください");
  }
}

async function ensureBaseChain() {
  const chainId = await window.ethereum.request({ method: "eth_chainId" });
  if (chainId === BASE_CHAIN_ID) return;

  showStatus("Base Mainnet へ切り替えています...", "info");
  try {
    await window.ethereum.request({
      method: "wallet_switchEthereumChain",
      params: [{ chainId: BASE_CHAIN_ID }],
    });
  } catch (switchErr) {
    if (switchErr.code === 4902) {
      await window.ethereum.request({
        method: "wallet_addEthereumChain",
        params: [{
          chainId:           BASE_CHAIN_ID,
          chainName:         "Base",
          nativeCurrency:    { name: "ETH", symbol: "ETH", decimals: 18 },
          rpcUrls:           ["https://mainnet.base.org"],
          blockExplorerUrls: ["https://basescan.org"],
        }],
      });
    } else {
      throw switchErr;
    }
  }

  const newChainId = await window.ethereum.request({ method: "eth_chainId" });
  if (newChainId !== BASE_CHAIN_ID) {
    throw new Error("Base Mainnet への切替に失敗しました。ウォレットで手動で切り替えてください");
  }
}

/* ================================================================
   バリデーション
================================================================ */
function validateAddress(addr) {
  const trimmed = (addr || "").trim();
  if (!trimmed) throw new Error("送金先アドレスを入力してください");
  if (!ethers.utils.isAddress(trimmed)) throw new Error("無効なEthereumアドレスです: " + trimmed);
  return ethers.utils.getAddress(trimmed);
}

function validateAmount(amount, symbol) {
  const trimmed = (amount || "").trim();
  if (!trimmed) throw new Error("金額を入力してください");
  const num = parseFloat(trimmed);
  if (isNaN(num) || num <= 0) throw new Error("有効な" + symbol + "金額を入力してください（0より大きい数値）");
  return trimmed;
}

/* ================================================================
   localStorage ヘルパー
================================================================ */
function loadHistory() {
  const h = JSON.parse(localStorage.getItem("txHistory") || "[]");
  document.getElementById("history").innerHTML = h.reverse().map(x =>
    `<div class='small'>${x.type}: ${x.amount}<br>${x.hash}</div><hr>`
  ).join("");
}

function saveHistory(item) {
  const h = JSON.parse(localStorage.getItem("txHistory") || "[]");
  h.push(item);
  localStorage.setItem("txHistory", JSON.stringify(h));
  loadHistory();
}

function renderAddressBook() {
  const items = JSON.parse(localStorage.getItem("addressBook") || "[]");
  document.getElementById("addressBook").innerHTML = items.map((x, i) =>
    `<div class="ab-entry">
      <span style="font-size:12px">${x.name} — <span style="color:var(--text-sub)">${x.address.slice(0,10)}…${x.address.slice(-6)}</span></span>
      <button onclick="copyAddress('${x.address}')">Copy</button>
    </div>`
  ).join("");
}

function saveAddress() {
  const name    = document.getElementById("saveName").value;
  const address = document.getElementById("saveAddress").value;
  const items   = JSON.parse(localStorage.getItem("addressBook") || "[]");
  items.push({ name, address });
  localStorage.setItem("addressBook", JSON.stringify(items));
  renderAddressBook();
}

function copyAddress(a) {
  navigator.clipboard.writeText(a);
  alert("Copied");
}

/* ================================================================
   Phase 3: Toast Notification
================================================================ */

/**
 * 画面右下にトースト通知を表示する。
 * @param {{ type: 'ok'|'error', title: string, msg: string, txHash?: string }} opts
 * @param {number} durationMs  自動消去までのミリ秒（デフォルト 8000）
 */
function showToast({ type = "ok", title, msg, txHash }, durationMs = 8000) {
  const container = document.getElementById("toastContainer");

  const el = document.createElement("div");
  el.className = "toast " + type;

  const icon = type === "ok" ? "✓" : "✕";

  el.innerHTML = `
    <div class="toast-icon" style="color:${type === "ok" ? "var(--accent)" : "var(--danger)"}">${icon}</div>
    <div class="toast-body">
      <div class="toast-title">${title}</div>
      ${msg ? `<div class="toast-msg">${msg}</div>` : ""}
      ${txHash ? `<a class="toast-link" href="https://basescan.org/tx/${txHash}" target="_blank" rel="noopener noreferrer">Basescan で確認 ↗</a>` : ""}
    </div>
    <button class="toast-close" aria-label="閉じる">✕</button>`;

  // 閉じるボタン
  el.querySelector(".toast-close").addEventListener("click", () => removeToast(el));

  container.appendChild(el);

  // 自動消去
  const timer = setTimeout(() => removeToast(el), durationMs);
  el._toastTimer = timer;
}

function removeToast(el) {
  clearTimeout(el._toastTimer);
  el.classList.add("hiding");
  el.addEventListener("transitionend", () => el.remove(), { once: true });
}

/* ================================================================
   Phase 3: 送金後フォームクリア
================================================================ */
function clearForm(token) {
  if (token === "ETH") {
    document.getElementById("ethTo").value     = "";
    document.getElementById("ethAmount").value = "";
  } else {
    document.getElementById("usdcTo").value     = "";
    document.getElementById("usdcAmount").value = "";
  }
}

/* ================================================================
   Phase 3: 残高リフレッシュ
================================================================ */
async function refreshBalances() {
  if (!currentAccount || typeof window.ethereum === "undefined") return;
  try {
    const balance = await window.ethereum.request({
      method: "eth_getBalance",
      params: [currentAccount, "latest"],
    });
    const eth = Number(ethers.utils.formatEther(balance)).toFixed(4);

    const ep  = new ethers.providers.Web3Provider(window.ethereum);
    const c   = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, ep);
    const raw = await c.balanceOf(currentAccount);
    const dec = await c.decimals();
    const usdc = Number(ethers.utils.formatUnits(raw, dec)).toFixed(2);

    // ETH残高表示を更新
    const ethEl  = document.querySelector("#walletInfo .bal:first-of-type");
    const usdcEl = document.querySelector("#walletInfo .bal:last-of-type");

    // querySelectorが確実に当たらないケースに備えてconnectWallet再描画で代替
    const walletEl = document.getElementById("walletInfo");
    walletEl.innerHTML = `
      <div class="addr">${currentAccount}</div>
      <div style="margin-top:6px;display:flex;gap:20px">
        <div><span style="color:var(--text-sub);font-size:11px">ETH</span><br><span class="bal">${eth}</span></div>
        <div><span style="color:var(--text-sub);font-size:11px">USDC</span><br><span class="bal">${usdc}</span></div>
      </div>
      <button onclick="copyAddress('${currentAccount}')" style="width:auto;padding:5px 14px;margin-top:10px;font-size:11px">Copy Address</button>`;
  } catch (_) {
    // 残高更新失敗はサイレントスキップ（送金自体は成功している）
  }
}


async function connectWallet() {
  if (typeof window.ethereum === "undefined") {
    showStatus("ウォレットが見つかりません。MetaMask などをインストールしてください", "error");
    return;
  }
  try {
    const accounts = await window.ethereum.request({ method: "eth_requestAccounts" });
    currentAccount = accounts[0];

    const chainId = await window.ethereum.request({ method: "eth_chainId" });
    if (chainId !== BASE_CHAIN_ID) {
      showStatus("Base Mainnet に接続されていません。送金時に自動切替を行います", "warn");
    } else {
      hideStatus();
    }

    const balance = await window.ethereum.request({
      method: "eth_getBalance",
      params: [currentAccount, "latest"],
    });
    const eth = Number(ethers.utils.formatEther(balance)).toFixed(4);

    const ep  = new ethers.providers.Web3Provider(window.ethereum);
    const c   = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, ep);
    const raw = await c.balanceOf(currentAccount);
    const dec = await c.decimals();
    const usdc = Number(ethers.utils.formatUnits(raw, dec)).toFixed(2);

    const short = currentAccount.slice(0, 8) + "…" + currentAccount.slice(-6);
    document.getElementById("walletInfo").innerHTML = `
      <div class="addr">${currentAccount}</div>
      <div style="margin-top:6px;display:flex;gap:20px">
        <div><span style="color:var(--text-sub);font-size:11px">ETH</span><br><span class="bal">${eth}</span></div>
        <div><span style="color:var(--text-sub);font-size:11px">USDC</span><br><span class="bal">${usdc}</span></div>
      </div>
      <button onclick="copyAddress('${currentAccount}')" style="width:auto;padding:5px 14px;margin-top:10px;font-size:11px">Copy Address</button>`;

    registerWalletEvents();
  } catch (e) {
    showStatus(friendlyError(e), "error");
  }
}

/* ================================================================
   ウォレットイベント
================================================================ */
let _walletEventsRegistered = false;

function registerWalletEvents() {
  if (_walletEventsRegistered) return;
  _walletEventsRegistered = true;

  window.ethereum.on("accountsChanged", (accounts) => {
    if (accounts.length === 0) {
      currentAccount = null;
      document.getElementById("walletInfo").textContent = "Not Connected";
      showStatus("ウォレットが切断されました。再接続してください", "warn");
    } else {
      currentAccount = accounts[0];
      showStatus("アカウントが切り替わりました。残高を更新しています...", "info");
      connectWallet();
    }
  });

  window.ethereum.on("chainChanged", (chainId) => {
    if (chainId !== BASE_CHAIN_ID) {
      showStatus("Base Mainnet 以外のネットワークに切り替わりました。送金時に自動切替します", "warn");
    } else {
      showStatus("Base Mainnet に接続されています", "ok");
    }
  });
}

/* ================================================================
   Phase 2: 送金確認モーダル
================================================================ */

/**
 * 送金ボタン押下時に呼ばれる。
 * バリデーション → モーダル表示。ここではウォレット署名しない。
 * @param {'ETH'|'USDC'} token
 */
async function initiateSend(token) {
  hideStatus();

  try {
    // ── ガード ──
    requireWallet();

    // ── バリデーション ──
    const toField     = token === "ETH" ? "ethTo"     : "usdcTo";
    const amountField = token === "ETH" ? "ethAmount" : "usdcAmount";
    const toAddr = validateAddress(document.getElementById(toField).value);
    const amount = validateAmount(document.getElementById(amountField).value, token);

    // ── 自分自身への送金を警告（送金は止めないが確認モーダルで明示） ──
    const isSelf = toAddr.toLowerCase() === currentAccount.toLowerCase();

    // ── pending に格納 ──
    _pendingTx = { token, to: toAddr, amount, isSelf };

    // ── モーダルに値をセット ──
    openModal(_pendingTx);

  } catch (e) {
    showStatus(friendlyError(e), "error");
  }
}

/**
 * モーダルを開いて内容を表示する。
 * @param {{ token: string, to: string, amount: string, isSelf: boolean }} tx
 */
function openModal(tx) {
  const isETH = tx.token === "ETH";

  // アイコン
  const iconEl = document.getElementById("modalIcon");
  iconEl.className = "icon " + (isETH ? "eth" : "usdc");
  iconEl.textContent = isETH ? "Ξ" : "$";

  // 各フィールド
  document.getElementById("modalAmount").textContent = tx.amount;
  document.getElementById("modalToken").innerHTML =
    `<span>${tx.token}</span>` + (tx.isSelf ? `<span style="color:var(--warn);margin-left:8px;font-size:10px">⚠ 自分自身のアドレス</span>` : "");
  document.getElementById("modalTo").textContent = tx.to;

  // オーバーレイ表示
  const overlay = document.getElementById("modalOverlay");
  overlay.classList.add("active");

  // フォーカスをConfirmボタンへ（アクセシビリティ）
  document.getElementById("modalConfirmBtn").focus();

  // ESCキーでキャンセル
  document.addEventListener("keydown", _handleModalKey);
}

/** ESCキー押下でモーダルをキャンセル */
function _handleModalKey(e) {
  if (e.key === "Escape") cancelModal();
}

/** モーダルを閉じて pending をクリア */
function cancelModal() {
  document.getElementById("modalOverlay").classList.remove("active");
  document.removeEventListener("keydown", _handleModalKey);
  _pendingTx = null;
  showStatus("送金をキャンセルしました", "warn");
}

/**
 * Confirm ボタン押下 → 実際の送金処理へ進む。
 */
async function confirmSend() {
  if (!_pendingTx) return;

  const tx = _pendingTx;
  _pendingTx = null;

  // モーダルを閉じる
  document.getElementById("modalOverlay").classList.remove("active");
  document.removeEventListener("keydown", _handleModalKey);

  // トークン種別に応じた送金を実行
  if (tx.token === "ETH") {
    await executeETH(tx.to, tx.amount);
  } else {
    await executeUSDC(tx.to, tx.amount);
  }
}

/* ================================================================
   ETH 送金実行（署名〜送信）
================================================================ */
async function executeETH(toAddr, amount) {
  hideStatus();
  setBusy("btnSendETH", true, "送信中...");

  try {
    await ensureBaseChain();

    showStatus("署名を確認してください...", "info");

    const ep     = new ethers.providers.Web3Provider(window.ethereum);
    const signer = ep.getSigner();
    const tx     = await signer.sendTransaction({
      to:    toAddr,
      value: ethers.utils.parseEther(amount),
    });

    showStatus("送信中... TX: " + tx.hash, "info");
    await tx.wait();

    saveHistory({ type: "ETH", amount, hash: tx.hash });
    showStatus("ETH 送金完了: " + tx.hash, "ok");

    // ── Phase 3: 後処理 ──
    clearForm("ETH");
    await refreshBalances();
    showToast({
      type:   "ok",
      title:  "ETH 送金完了",
      msg:    `${amount} ETH → ${toAddr.slice(0,8)}…${toAddr.slice(-6)}`,
      txHash: tx.hash,
    });

  } catch (e) {
    showStatus(friendlyError(e), "error");
  } finally {
    setBusy("btnSendETH", false, "Send ETH");
  }
}

/* ================================================================
   USDC 送金実行（署名〜送信）
================================================================ */
async function executeUSDC(toAddr, amount) {
  hideStatus();
  setBusy("btnSendUSDC", true, "送信中...");

  try {
    await ensureBaseChain();

    showStatus("署名を確認してください...", "info");

    const ep     = new ethers.providers.Web3Provider(window.ethereum);
    const signer = ep.getSigner();
    const c      = new ethers.Contract(USDC_ADDRESS, ERC20_ABI, signer);
    const dec    = await c.decimals();
    const tx     = await c.transfer(toAddr, ethers.utils.parseUnits(amount, dec));

    showStatus("送信中... TX: " + tx.hash, "info");
    await tx.wait();

    saveHistory({ type: "USDC", amount, hash: tx.hash });
    showStatus("USDC 送金完了: " + tx.hash, "ok");

    // ── Phase 3: 後処理 ──
    clearForm("USDC");
    await refreshBalances();
    showToast({
      type:   "ok",
      title:  "USDC 送金完了",
      msg:    `${amount} USDC → ${toAddr.slice(0,8)}…${toAddr.slice(-6)}`,
      txHash: tx.hash,
    });

  } catch (e) {
    showStatus(friendlyError(e), "error");
  } finally {
    setBusy("btnSendUSDC", false, "Send USDC");
  }
}

/* ================================================================
   AI チャット
================================================================ */
async function sendMessage() {
  try {
    const response = await fetch("http://localhost:3001/chat", {
      method:  "POST",
      headers: { "Content-Type": "application/json" },
      body:    JSON.stringify({ message: document.getElementById("userInput").value }),
    });
    const data = await response.json();
    document.getElementById("response").innerText = data.reply;
  } catch (e) {
    document.getElementById("response").innerText = e.message;
  }
}

================================================================ */
loadHistory();
renderAddressBook();
